# Подключается внутри HTTPS-блока server с настроенным сертификатом.
location ~ ^/status(?:/data\.json|/assets/(?:app\.css|common\.js|status\.js|favicon\.svg|logo-panel\.svg))?$ {
    access_log off;
    if ($request_method !~ ^(GET|HEAD)$) {
        add_header Allow "GET, HEAD" always;
        return 405;
    }
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $http_host;
    proxy_set_header X-IOF-HTTPS 1;
    proxy_set_header Cookie "";
}

location = /admin {
    access_log off;
    absolute_redirect off;
    return 308 /admin/;
}

location ^~ /admin/ {
    access_log off;
    error_log /var/log/nginx/iof-error.log crit;
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-IOF-HTTPS 1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}
