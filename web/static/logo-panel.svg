  <linearGradient id="wave2" x1="0.12" y1="0.19" x2="0.92" y2="0.85"><stop offset="0" stop-color="#079af3"/><stop offset="0.36" stop-color="#02d7f5"/><stop offset="0.55" stop-color="#0063d1"/><stop offset="0.78" stop-color="#007ce6"/><stop offset="1" stop-color="#02d6fd"/></linearGradient>
  <linearGradient id="wave3" x1="0.1" y1="0.24" x2="0.9" y2="0.65"><stop offset="0" stop-color="#0631a7"/><stop offset="0.29" stop-color="#006df4"/><stop offset="0.65" stop-color="#00b6fb"/><stop offset="0.9" stop-color="#00eaf5"/><stop offset="1" stop-color="#0096f9"/></linearGradient>
  <clipPath id="logoBoundary"><circle cx="615.5" cy="609.5" r="515"/></clipPath>
  <clipPath id="shieldBoundary"><path d="M440 456 H974 V808 C928 862 837 906 742 878 C634 854 559 801 440 790 Z"/></clipPath>
</defs>
<rect width="1254" height="1254" fill="url(#night)"/>
<g clip-path="url(#logoBoundary)">
