<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-label="Остров свободы — пальма, золотой щит и морские волны">
<title>Остров свободы</title>
<desc>Премиальный векторный логотип VPN-сервиса: голубая пальма, золотистый щит без символов, три морские волны и градиентное кольцо на тёмном фоне.</desc>
<defs>
  <radialGradient id="night" cx="51%" cy="49%" r="74%"><stop offset="0" stop-color="#06091b"/><stop offset="0.70" stop-color="#030510"/><stop offset="1" stop-color="#01020b"/></radialGradient>
  <!-- continuous palette for segmented arc -->
  <linearGradient id="ringTL" x1="0" y1="0.85" x2="0.95" y2="0.1"><stop offset="0" stop-color="#096aff"/><stop offset="0.36" stop-color="#00bdf5"/><stop offset="0.70" stop-color="#00e7ee"/><stop offset="1" stop-color="#6772db"/></linearGradient>
  <linearGradient id="ringTR" x1="0" y1="0" x2="1" y2="0.88"><stop offset="0" stop-color="#6772db"/><stop offset="0.13" stop-color="#ca628d"/><stop offset="0.34" stop-color="#ff9a27"/><stop offset="0.63" stop-color="#ffd208"/><stop offset="0.82" stop-color="#ff9d02"/><stop offset="1" stop-color="#f65b04"/></linearGradient>
  <linearGradient id="ringBR" x1="0.08" y1="1" x2="0.93" y2="0"><stop offset="0" stop-color="#aa53b8"/><stop offset="0.17" stop-color="#ed6e4e"/><stop offset="0.45" stop-color="#ffa500"/><stop offset="0.74" stop-color="#ffbd03"/><stop offset="1" stop-color="#f65b04"/></linearGradient>
  <linearGradient id="ringBL" x1="0.92" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#aa53b8"/><stop offset="0.30" stop-color="#0867fa"/><stop offset="0.60" stop-color="#05a7ff"/><stop offset="1" stop-color="#0874f8"/></linearGradient>
  <linearGradient id="trunk" x1="0.08" y1="0.12" x2="1" y2="0.82"><stop offset="0" stop-color="#02eff1"/><stop offset="0.25" stop-color="#04bbfb"/><stop offset="0.54" stop-color="#006be9"/><stop offset="0.78" stop-color="#004bda"/><stop offset="1" stop-color="#003499"/></linearGradient>
  <linearGradient id="trunkSheen" x1="0" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#2ffbff"/><stop offset="0.47" stop-color="#00dcf7"/><stop offset="1" stop-color="#0796f4"/></linearGradient>
  <linearGradient id="leafCyan" x1="0.12" y1="0.12" x2="0.84" y2="0.9"><stop offset="0" stop-color="#69ffff"/><stop offset="0.19" stop-color="#09e7f6"/><stop offset="0.57" stop-color="#078df4"/><stop offset="1" stop-color="#0752d4"/></linearGradient>
  <linearGradient id="leafBlue" x1="0.18" y1="0.05" x2="0.9" y2="1"><stop offset="0" stop-color="#11ddf5"/><stop offset="0.48" stop-color="#096ef0"/><stop offset="0.82" stop-color="#0756df"/><stop offset="1" stop-color="#092da1"/></linearGradient>
  <linearGradient id="leafRight" x1="0.3" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#0065eb"/><stop offset="0.52" stop-color="#0899f4"/><stop offset="1" stop-color="#09e8ef"/></linearGradient>
  <linearGradient id="leafTeal" x1="0.13" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#43f9fc"/><stop offset="0.48" stop-color="#09cafa"/><stop offset="1" stop-color="#0266de"/></linearGradient>
  <linearGradient id="shieldOuter" x1="0.02" y1="0.03" x2="0.84" y2="0.94"><stop offset="0" stop-color="#fff94b"/><stop offset="0.25" stop-color="#ffc00c"/><stop offset="0.53" stop-color="#ff8700"/><stop offset="0.78" stop-color="#f86b00"/><stop offset="1" stop-color="#c83b06"/></linearGradient>
  <linearGradient id="shieldFace" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#ffde06"/><stop offset="0.43" stop-color="#ffb300"/><stop offset="0.75" stop-color="#ff8702"/><stop offset="1" stop-color="#fa6501"/></linearGradient>
  <linearGradient id="shieldTop" x1="0" y1="0" x2="0.95" y2="0.7"><stop offset="0" stop-color="#fff961"/><stop offset="0.55" stop-color="#ffe330"/><stop offset="1" stop-color="#ffc513"/></linearGradient>
  <linearGradient id="shieldRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbc10"/><stop offset="0.55" stop-color="#ff8e08"/><stop offset="1" stop-color="#ee5505"/></linearGradient>
  <linearGradient id="waveFront" x1="0.06" y1="0.12" x2="0.87" y2="0.92"><stop offset="0" stop-color="#0670f6"/><stop offset="0.27" stop-color="#01d9f4"/><stop offset="0.53" stop-color="#0076e8"/><stop offset="0.72" stop-color="#0063c9"/><stop offset="1" stop-color="#00ebf7"/></linearGradient>
