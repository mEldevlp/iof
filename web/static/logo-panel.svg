  <path d="M416 1065 C497 985 572 981 670 988 C809 1007 920 960 1010 869 C952 955 864 991 764 999 C635 1003 523 1005 416 1065Z" fill="#098ff9" opacity=".34"/>
</g>
<!-- Four gradient sweeps produce a true editable vector circular border -->
<g fill="none" stroke-width="26" stroke-linejoin="round" stroke-linecap="butt">
  <path d="M102 609.5 A513.5 513.5 0 0 1 615.5 96" stroke="url(#ringTL)"/>
  <path d="M615.5 96 A513.5 513.5 0 0 1 1129 609.5" stroke="url(#ringTR)"/>
  <path d="M1129 609.5 A513.5 513.5 0 0 1 615.5 1123" stroke="url(#ringBR)"/>
  <path d="M615.5 1123 A513.5 513.5 0 0 1 102 609.5" stroke="url(#ringBL)"/>
</g>
<!-- Hide microscopic seams at the four color transitions without adding glow -->
<g><circle cx="615.5" cy="96" r="2.5" fill="#6772db"/><circle cx="1129" cy="609.5" r="2.5" fill="#f65b04"/><circle cx="615.5" cy="1123" r="2.5" fill="#aa53b8"/><circle cx="102" cy="609.5" r="2.5" fill="#0874f8"/></g>
</svg>