  <path d="M530 428 C607 376 677 382 733 397 C782 412 815 471 834 538 C797 484 744 429 687 413 C641 399 580 417 530 428Z" fill="url(#leafRight)"/>
  <path d="M530 428 C593 423 658 442 708 487 C651 459 585 438 530 428Z" fill="url(#leafTeal)"/>
  <!-- Short downward central leaflet -->
  <path d="M530 428 C557 441 558 462 548 490 C538 522 503 541 478 569 C480 514 495 465 530 428Z" fill="url(#leafBlue)"/>
  <path d="M530 428 C511 469 491 512 478 569 C478 506 494 462 530 428Z" fill="url(#leafCyan)"/>

  <!-- Warm golden shield; plain shield with no key -->
  <g clip-path="url(#shieldBoundary)">
  <path d="M718 500 C774 544 845 581 926 599 L926 684 C920 772 886 850 839 897 C757 949 642 936 590 886 C532 813 501 707 501 599 C592 584 667 548 718 500Z" fill="url(#shieldOuter)"/>
