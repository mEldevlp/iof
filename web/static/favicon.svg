<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Favicon circle with 75 percent blue and 25 percent gold in the fourth quadrant">
  <defs>
    <linearGradient id="blueGrad" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26E6E6"/>
      <stop offset="55%" stop-color="#1C96F2"/>
      <stop offset="100%" stop-color="#133DFF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="256" y1="256" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE84A"/>
      <stop offset="55%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="220"/>
    </clipPath>
  </defs>

  <!-- Base 75% blue circle -->
  <circle cx="256" cy="256" r="220" fill="url(#blueGrad)"/>

  <!-- 25% gold in the 4th quadrant (bottom-right on a coordinate graph) -->
  <g clip-path="url(#circleClip)">
    <path d="M256 256 L476 256 L476 476 L256 476 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
