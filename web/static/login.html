<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Island of Freedom</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="common.js"></script>
  <script src="login.js" defer></script>
</head>
<body class="login-page">
  <main class="card login-card">
    <div class="brand">
      <img class="logo" src="favicon.svg" alt="">
      <div><b>Island of Freedom</b><small>Веб-панель iof</small></div>
    </div>
    <h1>Вход в панель</h1>
    <p class="note" id="password-changed" role="status" hidden>Пароль изменён. Войдите с новым паролем.</p>
    <form id="login-form" class="password-form" method="post">
      <div class="field">
        <label for="login">Логин</label>
        <input id="login" name="username" autocomplete="username" maxlength="64" required autofocus>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn primary" type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
