<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Island of Freedom</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="common.js" defer></script>
  <script src="demo.js" defer></script>
  <script src="dashboard.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="var(--accent)"/>
        <path d="M5 21c3-1.6 5.4-1.6 8 0s5.4 1.6 8 0 5.2-1.6 6 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <path d="M11 17.5c1-4.5 3-7.5 6-8.5M17 9c-1.6 2.6-1.4 5.5 0 8.6M17 9c2.4.2 4.6 1.4 5.5 3.6M17 9c-2.6-.6-5 0-6.3 1.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Island of Freedom</h1>
        <p>VPN-узлы: Hysteria2 и AmneziaWG</p>
      </div>
    </div>
    <nav class="nav" aria-label="Разделы">
      <a href="./" aria-current="page">Обзор</a>
      <a href="hy2.html">Hysteria2</a>
      <a href="add.html">Добавить сервер</a>
      <a href="migrate.html">Перенос</a>
    </nav>
    <div class="controls">
      <span id="stamp" class="stamp" aria-live="polite">Загрузка…</span>
      <label class="select">
        <span class="sr-only">Автообновление</span>
        <select id="auto">
          <option value="0">Автообновление выкл.</option>
          <option value="30">Каждые 30 с</option>
          <option value="60">Каждую минуту</option>
          <option value="300">Каждые 5 мин</option>
        </select>
      </label>
      <button id="refresh" class="btn" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Обновить</span>
      </button>
    </div>
  </header>

  <main>
    <div id="alert" class="alert" role="alert" hidden></div>
    <div id="migrate-banner" class="note warn banner" role="status" hidden></div>

    <section id="health" class="health" aria-live="polite"></section>

    <section id="kpis" class="kpis" aria-label="Сводка"></section>

    <section class="card">
      <div class="card-head">
        <h2>Узлы <span id="nodes-count" class="count"></span></h2>
        <div class="filters">
          <input id="q" type="search" placeholder="Поиск: имя, подпись, адрес" aria-label="Поиск узлов">
          <label class="check"><input id="onlybad" type="checkbox"> только с проблемами</label>
        </div>
      </div>
      <div class="table-wrap">
        <table class="nodes">
          <thead>
            <tr>
              <th>Узел</th>
              <th>Адрес</th>
              <th>Hysteria2</th>
              <th>AmneziaWG</th>
              <th class="col-meter">ЦП</th>
              <th class="col-meter">Память</th>
              <th class="col-meter">Диск</th>
              <th>Работает</th>
              <th class="num">Отклик</th>
            </tr>
          </thead>
          <tbody id="nodes"></tbody>
        </table>
      </div>
      <p id="nodes-empty" class="empty" hidden></p>
    </section>

    <div class="grid3">
      <section class="card">
        <div class="card-head"><h2>Ретрансляторы <span id="relays-count" class="count"></span></h2></div>
        <div id="relays" class="list"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Группы Hysteria2 <span id="hy2-count" class="count"></span></h2></div>
        <div id="hy2" class="list"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Клиенты AmneziaWG <span id="awg-count" class="count"></span></h2></div>
        <div id="awg" class="list"></div>
      </section>
    </div>
  </main>

  <footer class="foot">
    iof-web · «Отклик» — время SSH-входа и сбора данных, а не пинг
  </footer>
</body>
</html>
